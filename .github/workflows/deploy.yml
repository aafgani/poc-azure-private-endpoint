name: Azure Bicep Actions

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select Environment
        type: choice
        options: [Development, Staging, Production]
        default: Development

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Az and Bicep versions
        run: |
          az version
          az bicep version

      - name: Lint Bicep
        run: |
          az bicep build \
            --file ./infra/azure-resources/main.bicep

      - name: Validate template
        run: |
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file ./infra/azure-resources/main.bicep

      - name: What-if preview
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file ./infra/azure-resources/main.bicep

      - name: Deploy
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template: ./infra/azure-resources/main.bicep
          failOnStdErr: false